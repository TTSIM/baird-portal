<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture 1: Local Anaesthesia & Patient Preparation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e17;--surface:#111827;--surface2:#1a2236;--card:#151d2e;
--accent:#3b82f6;--accent2:#60a5fa;--accent-warm:#f59e0b;--accent-green:#10b981;--accent-red:#ef4444;
--text:#e2e8f0;--text-dim:#94a3b8;--text-bright:#f8fafc;
--border:#1e293b;--glow:rgba(59,130,246,0.15);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
.app{height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.lecture-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase}
.topbar h1{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text-bright)}
.slide-counter{font-size:13px;color:var(--text-dim);font-weight:500}
.progress-track{height:3px;background:var(--border);width:100%}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;border-radius:0 2px 2px 0}
.slide-area{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease;transform:translateX(60px)}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.exit-left{opacity:0;transform:translateX(-60px)}
.slide-inner{max-width:960px;width:100%;animation:slideUp .5s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.nav-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;background:var(--surface);border-top:1px solid var(--border)}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 24px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:8px}
.nav-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.nav-dots{display:flex;gap:6px}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .25s}
.nav-dot.active{background:var(--accent);transform:scale(1.3)}
.nav-dot.visited{background:var(--text-dim)}

/* Slide typography */
.slide-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,42px);color:var(--text-bright);margin-bottom:8px;line-height:1.2}
.slide-subtitle{font-size:15px;color:var(--accent2);font-weight:500;margin-bottom:28px;letter-spacing:.5px}
.slide-text{font-size:16px;line-height:1.75;color:var(--text);max-width:720px}
.slide-text strong{color:var(--text-bright);font-weight:600}

/* Title slide */
.title-slide{text-align:center}
.title-slide .slide-title{font-size:clamp(36px,5vw,56px);margin-bottom:16px}
.title-slide .slide-subtitle{font-size:18px;margin-bottom:32px}
.title-meta{font-size:13px;color:var(--text-dim)}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:all .3s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px rgba(59,130,246,.12)}
.card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:600;color:var(--text-bright);margin-bottom:6px}
.card p{font-size:13px;color:var(--text-dim);line-height:1.6}

/* Interactive quiz */
.quiz-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-top:20px}
.quiz-q{font-size:17px;font-weight:600;color:var(--text-bright);margin-bottom:18px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;font-size:14px;transition:all .25s;display:flex;align-items:center;gap:12px}
.quiz-opt:hover{border-color:var(--accent);background:rgba(59,130,246,.06)}
.quiz-opt.correct{border-color:var(--accent-green);background:rgba(16,185,129,.1);color:var(--accent-green)}
.quiz-opt.wrong{border-color:var(--accent-red);background:rgba(239,68,68,.08);color:var(--accent-red)}
.quiz-opt .letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.quiz-opt.correct .letter{background:var(--accent-green);color:#fff}
.quiz-opt.wrong .letter{background:var(--accent-red);color:#fff}
.quiz-feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--accent-green)}
.quiz-feedback.wrong{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--accent-red)}

/* Diagram */
.diagram-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:16px;overflow:auto}
.diagram-wrap svg{width:100%;max-width:800px;margin:0 auto;display:block}

/* Dosage calculator */
.calc-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-top:16px}
.calc-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.calc-label{font-size:14px;color:var(--text-dim);min-width:140px}
.calc-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text-bright);font-size:15px;font-family:'Outfit',sans-serif;width:120px}
.calc-input:focus{outline:none;border-color:var(--accent)}
.calc-result{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(96,165,250,.05));border:1px solid rgba(59,130,246,.25);border-radius:12px;padding:18px;text-align:center;margin-top:8px}
.calc-result .big{font-size:32px;font-weight:700;color:var(--accent2);font-family:'DM Serif Display',serif}
.calc-result .unit{font-size:14px;color:var(--text-dim);margin-top:4px}

/* Timeline */
.timeline{margin-top:20px;position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:20px;padding-left:20px}
.tl-item::before{content:'';position:absolute;left:-24px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl-item h4{font-size:15px;color:var(--text-bright);font-weight:600;margin-bottom:4px}
.tl-item p{font-size:13px;color:var(--text-dim);line-height:1.6}

/* Comparison table */
.comp-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.comp-table th{background:var(--surface2);color:var(--accent2);padding:12px 16px;text-align:left;font-weight:600;border-bottom:2px solid var(--accent)}
.comp-table td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text)}
.comp-table tr:hover td{background:rgba(59,130,246,.04)}

/* Highlight box */
.highlight{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.03));border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:18px 22px;margin-top:16px}
.highlight-title{font-size:13px;font-weight:700;color:var(--accent-warm);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.highlight p{font-size:14px;color:var(--text);line-height:1.7}

/* Reveal list */
.reveal-list{margin-top:16px}
.reveal-item{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:all .3s}
.reveal-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:14px;color:var(--text-bright)}
.reveal-header:hover{color:var(--accent2)}
.reveal-arrow{transition:transform .3s;color:var(--text-dim)}
.reveal-item.open .reveal-arrow{transform:rotate(180deg)}
.reveal-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.reveal-item.open .reveal-body{max-height:400px}
.reveal-body-inner{padding:0 18px 16px;font-size:13px;color:var(--text-dim);line-height:1.7}

/* Two column */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr}}

/* Injection map SVG hover */
.zone{opacity:.5;cursor:pointer;transition:opacity .3s}
.zone:hover,.zone.active{opacity:1}
.zone-label{font-size:12px;fill:var(--text);font-family:'Outfit',sans-serif;pointer-events:none}

/* Key point */
.key-point{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.key-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.key-content h4{font-size:15px;color:var(--text-bright);font-weight:600;margin-bottom:3px}
.key-content p{font-size:13px;color:var(--text-dim);line-height:1.6}
.portal-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600}
.portal-back:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <a class="portal-back" href="../../baird_implant_portal.html">← Back to Portal</a>
      <span class="lecture-badge">Lecture 1</span>
      <h1>Local Anaesthesia & Patient Preparation</h1>
    </div>
    <span class="slide-counter" id="counter">1 / 30</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="slide-area" id="slideArea"></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Prev</button>
    <div class="nav-dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>

<script>
const slides = [
// 0 - Title
`<div class="title-slide">
  <div class="slide-subtitle">Dental Implant Course — Lecture 1 of 3</div>
  <div class="slide-title">Local Anaesthesia &<br>Patient Preparation</div>
  <p class="title-meta" style="margin-top:24px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.7">Covering dosage calculation, injection techniques, anaesthetic agents, palatal infiltration, cleaning solutions, and team setup for implant surgery.</p>
  <p class="title-meta" style="margin-top:32px;opacity:.5">Use arrow keys or buttons to navigate • 30 slides</p>
</div>`,

// 1 - Why LA matters
`<div>
  <div class="slide-subtitle">Foundation</div>
  <div class="slide-title">Why Anaesthesia Matters in Implant Surgery</div>
  <div class="slide-text" style="margin-top:20px">Unlike routine dentistry where a single injection suffices, implant surgery demands <strong>comprehensive, long-lasting anaesthesia</strong>. The procedure involves flap elevation, bone drilling, and potentially grafting — all of which require the patient to be completely comfortable for extended periods.</div>
  <div class="highlight" style="margin-top:24px">
    <div class="highlight-title">💡 Key Principle</div>
    <p><strong>"I've never regretted numbing a patient fully."</strong> — Cutting down on anaesthesia and trying to manage along the way always makes things worse. Invest in thorough numbing from the start.</p>
  </div>
</div>`,

// 2 - Dosage calculation
`<div>
  <div class="slide-subtitle">Dosage</div>
  <div class="slide-title">Calculating Maximum Dosage</div>
  <div class="slide-text">The general rule is <strong>1 cartridge per 10 kg</strong> of body weight as the maximum dose. Each cartridge contains approximately <strong>2 ml</strong> of anaesthetic solution.</div>
  <div class="calc-wrap">
    <div class="calc-row">
      <span class="calc-label">Patient weight (kg):</span>
      <input class="calc-input" type="number" id="weightInput" value="70" min="20" max="200" oninput="calcDose()">
    </div>
    <div class="calc-result">
      <div class="big" id="doseResult">7</div>
      <div class="unit">maximum cartridges (≈ <span id="mlResult">14</span> ml)</div>
    </div>
  </div>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">⚠️ Remember</div>
    <p>This is the <strong>maximum</strong> — not the target. For a single implant, start with 2–3 cartridges and top up as needed every 45 minutes.</p>
  </div>
</div>`,

// 3 - Anaesthetic agents
`<div>
  <div class="slide-subtitle">Pharmacology</div>
  <div class="slide-title">Articaine vs Mepivacaine</div>
  <table class="comp-table">
    <thead><tr><th>Property</th><th>Articaine</th><th>Mepivacaine</th></tr></thead>
    <tbody>
      <tr><td><strong>Onset</strong></td><td>Fast (1–2 min)</td><td>Moderate (2–4 min)</td></tr>
      <tr><td><strong>Duration</strong></td><td>60–75 min (with adrenaline)</td><td>20–40 min (plain)</td></tr>
      <tr><td><strong>Bone penetration</strong></td><td>Excellent — diffuses through cortical bone</td><td>Good</td></tr>
      <tr><td><strong>Vasoconstrictor</strong></td><td>Usually 1:100,000 or 1:200,000 adrenaline</td><td>Available plain (3%) or with levonordefrin</td></tr>
      <tr><td><strong>Best used for</strong></td><td>Primary anaesthesia during surgery</td><td>Initial injection / patients with CV concerns</td></tr>
    </tbody>
  </table>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">Clinical Tip</div>
    <p>Use a <strong>mixture of both</strong> — start without adrenaline-heavy solutions, then use articaine (with adrenaline) for the vasoconstricting effect to reduce bleeding and prolong anaesthesia.</p>
  </div>
</div>`,

// 4 - How many cartridges
`<div>
  <div class="slide-subtitle">Protocol</div>
  <div class="slide-title">Starting Dose for Single Implant Surgery</div>
  <div class="card-grid">
    <div class="card">
      <div class="card-icon" style="background:rgba(59,130,246,.15);color:var(--accent)">💉</div>
      <h3>Initial Dose</h3>
      <p>2–3 cartridges (~4–6 ml) administered before the procedure begins.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(245,158,11,.15);color:var(--accent-warm)">⏱️</div>
      <h3>Top-Up Timer</h3>
      <p>Set an alarm every <strong>45 minutes</strong>. Top up <em>before</em> the patient feels pain — don't wait for complaints.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(16,185,129,.15);color:var(--accent-green)">🔧</div>
      <h3>Equipment Ready</h3>
      <p>Have a <strong>sterile syringe</strong> and several extra cartridges prepared. For multi-site surgery, keep a second needle.</p>
    </div>
  </div>
  <div class="slide-text" style="margin-top:20px;font-size:14px;color:var(--text-dim)">If doing two sites, a soft tissue graft, or extending a flap — always have a second needle ready to use.</div>
</div>`,

// 5 - Zone of numbing
`<div>
  <div class="slide-subtitle">Technique</div>
  <div class="slide-title">How Wide Should You Numb?</div>
  <div class="slide-text">Always numb <strong>at least 2–3 teeth on either side</strong> of the implant site. Even a narrow flap extends nerve endings, so pain, pressure, and bleeding can originate from a distance.</div>
  <div class="diagram-wrap">
    <svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="numb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".05"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".05"/></linearGradient>
      </defs>
      <rect x="100" y="20" width="500" height="180" rx="12" fill="#151d2e" stroke="#1e293b"/>
      <!-- Teeth -->
      <g font-family="Outfit" font-size="11" fill="#94a3b8" text-anchor="middle">
        <rect x="135" y="80" width="50" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="160" y="72">Central</text>
        <rect x="205" y="80" width="50" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="230" y="72">Lateral</text>
        <rect x="275" y="80" width="50" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="300" y="72">Canine</text>
        <rect x="345" y="75" width="55" height="70" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
        <text x="372" y="67" fill="#60a5fa" font-weight="600">1st PM ★</text>
        <rect x="420" y="80" width="55" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="447" y="72">2nd PM</text>
        <rect x="495" y="80" width="55" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="522" y="72">1st Molar</text>
      </g>
      <!-- Numbing zone -->
      <rect x="130" y="60" width="430" height="100" rx="8" fill="url(#numb)"/>
      <!-- Arrows -->
      <line x1="160" y1="175" x2="520" y2="175" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="350" y="198" font-family="Outfit" font-size="12" fill="#60a5fa" text-anchor="middle" font-weight="600">← Numbing zone: 2–3 teeth either side →</text>
    </svg>
  </div>
  <div class="slide-text" style="margin-top:12px;font-size:14px"><strong>Example:</strong> For a premolar implant, numb from near the central all the way to the first/second molar.</div>
</div>`,

// 6 - Palatal numbing
`<div>
  <div class="slide-subtitle">Technique</div>
  <div class="slide-title">Palatal Infiltration</div>
  <div class="two-col">
    <div>
      <div class="slide-text" style="font-size:14px;line-height:1.8">
        <strong>The palatal mucosa is extremely thick</strong>, so a couple of drops won't suffice for surgery. You need at least <strong>0.5–1 ml</strong> (roughly half a cartridge) into the palate.
        <br><br>
        <strong>Why more is needed:</strong>
        <br>• Flap elevation may require palatal tissue manipulation
        <br>• De-epithelialisation or connective tissue grafts need full numbing
        <br>• The palate is the <strong>most likely source of bleeding</strong> during surgery — it's extremely well vascularised
      </div>
    </div>
    <div>
      <div class="highlight">
        <div class="highlight-title">⚠️ Complication Warning</div>
        <p>Excessive compression during palatal injection can cause <strong>soft tissue necrosis</strong> — inject slowly, step by step. In rare cases, lesions can form on the palate from aggressive injection technique.</p>
      </div>
      <div class="highlight" style="margin-top:12px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(16,185,129,.03));border-color:rgba(16,185,129,.25)">
        <div class="highlight-title" style="color:var(--accent-green)">✓ Best Practice</div>
        <p>Inject <strong>slowly and progressively</strong>. Extra palatal numbing also helps control bleeding if you nick a palatal artery — the vasoconstriction buys you time.</p>
      </div>
    </div>
  </div>
</div>`,

// 7 - Cleaning solutions
`<div>
  <div class="slide-subtitle">Antisepsis</div>
  <div class="slide-title">Surgical Cleaning Solutions</div>
  <div class="card-grid">
    <div class="card">
      <div class="card-icon" style="background:rgba(59,130,246,.15);color:var(--accent)">🧴</div>
      <h3>Clinisept (0.2% CHX)</h3>
      <p>Safe for facial skin. Suitable for patients with minor allergies. Used for disinfecting cartridges and the patient's face. A popular choice for intra-oral and peri-oral antisepsis.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(245,158,11,.15);color:var(--accent-warm)">🧪</div>
      <h3>Trisept (~0.02% CHX)</h3>
      <p>Sold in small sachets. Yellowish solution with a mixture of active ingredients. Lower concentration but still effective. Good alternative option.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(239,68,68,.15);color:var(--accent-red)">🔶</div>
      <h3>Iodine (Betadine)</h3>
      <p>Traditional surgical antiseptic. Effective but stains the skin. Still used widely in general surgery. Less cosmetically friendly for dental patients.</p>
    </div>
  </div>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">⚠️ Allergy Alert</div>
    <p>If a patient reports a <strong>chlorhexidine allergy</strong>, you must source an alternative solution. Always check allergies in the medical history before surgery.</p>
  </div>
</div>`,

// 8 - Quiz 1
`<div>
  <div class="slide-subtitle">Knowledge Check</div>
  <div class="slide-title">Quiz: Anaesthesia Basics</div>
  <div class="quiz-box">
    <div class="quiz-q">A 70 kg patient is undergoing single implant placement on an upper premolar. What is the maximum number of anaesthetic cartridges you can administer?</div>
    <div class="quiz-opts" id="q1">
      <div class="quiz-opt" onclick="checkQuiz('q1',this,false)"><span class="letter">A</span>5 cartridges</div>
      <div class="quiz-opt" onclick="checkQuiz('q1',this,true)"><span class="letter">B</span>7 cartridges</div>
      <div class="quiz-opt" onclick="checkQuiz('q1',this,false)"><span class="letter">C</span>10 cartridges</div>

// 9 - Top-up protocol
`<div>
  <div class="slide-subtitle">Protocol</div>
  <div class="slide-title">The 45-Minute Top-Up Protocol</div>
  <div class="timeline">
    <div class="tl-item"><h4>0 min — Initial Administration</h4><p>2–3 cartridges. Mix of articaine and mepivacaine. Begin once patient is fully numb.</p></div>
    <div class="tl-item"><h4>45 min — First Top-Up</h4><p>Nurse alarm sounds. Evaluate numbness. Administer 1–2 additional cartridges <strong>before</strong> patient reports any sensation.</p></div>
    <div class="tl-item"><h4>90 min — Second Top-Up</h4><p>Continue monitoring. Top up as needed. The patient should never reach the point of feeling pain during surgery.</p></div>
    <div class="tl-item"><h4>Ongoing — Monitor Until Closure</h4><p>Keep sterile syringe and cartridges accessible throughout. The goal: zero pain interruptions.</p></div>
  </div>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">💡 Why Pre-Emptive?</div>
    <p>If the patient starts twitching or complaining mid-procedure — while you're placing particles or working on fine details — it disrupts your workflow significantly. Top up <strong>before</strong> pain returns.</p>
  </div>
</div>`,

// 18 - 3mm rule
`<div>
  <div class="slide-subtitle">Assessment</div>
  <div class="slide-title">The 3 mm Rule</div>
  <div class="two-col">
    <div>
      <div class="card" style="border-color:rgba(16,185,129,.3)">
        <h3 style="color:var(--accent-green)">≤ 3 mm — Healthy</h3>
        <p style="margin-top:8px;line-height:1.8">Sufficient blood supply for the soft tissue to reattach after flap elevation. When you suture back, the periosteum is healthy and everything reattaches to where it was.</p>
      </div>
    </div>
    <div>
      <div class="card" style="border-color:rgba(239,68,68,.3)">
        <h3 style="color:var(--accent-red)">≥ 4 mm — Concern</h3>
        <p style="margin-top:8px;line-height:1.8">Indicates a pseudo-connection between soft tissue attachments. Higher chance of biological width re-establishing at 3 mm regardless — meaning potential recession or tissue loss.</p>
      </div>
    </div>
  </div>
  <div class="highlight" style="margin-top:20px">
    <div class="highlight-title">💡 Clinical Pearl</div>
    <p><strong>"The bone sets the tone, the soft tissue is the issue."</strong> — The soft tissue follows the bone. Respect the bone, and the soft tissue will follow. Check mid-buccal as well — sometimes pockets or retention are hiding there.</p>
  </div>
</div>`,

// 21 - Bone sets the tone
`<div>
  <div class="slide-subtitle">Principle</div>
  <div class="slide-title" style="font-size:clamp(32px,4.5vw,52px);text-align:center;margin-top:40px">"The bone sets the tone,<br><span style="color:var(--accent2)">the soft tissue is the issue."</span></div>
  <div class="slide-text" style="text-align:center;margin:24px auto 0;max-width:600px">This fundamental principle of implant dentistry reminds us that <strong>soft tissue behaviour follows bone architecture</strong>. If the bone is compromised, the soft tissue will reflect that. Respect and preserve bone at every stage of surgery.</div>
</div>`,

// 22 - Flap design intro
`<div>
  <div class="slide-subtitle">Surgical Technique</div>
  <div class="slide-title">Flap Design Principles</div>
  <div class="slide-text">Proper flap design is essential for visibility, access, and healing. The two main designs for implant surgery:</div>
  <div class="two-col" style="margin-top:20px">
    <div>
      <div class="card">
        <h3>Semi-Envelope Flap</h3>
        <p style="margin-top:8px;line-height:1.8">Intrasulcular incision without a vertical releasing incision. Goes around the teeth adjacent to the surgical site. Less invasive but provides less access.</p>
      </div>
    </div>
    <div>
      <div class="card">
        <h3>Full Envelope Flap</h3>
        <p style="margin-top:8px;line-height:1.8">Always extends to <strong>one extra tooth unit</strong> beyond the surgical site. If you only incise between the two adjacent teeth, the flap will tear upon reflection. The extension prevents this.</p>
      </div>
    </div>
  </div>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">⚠️ Critical Rule</div>
    <p>When doing a full envelope flap, <strong>always extend to one extra unit</strong>. If you stop right at the boundary, the flap will tear as soon as you try to reflect it.</p>
  </div>
</div>`,

// 23 - 15C blade technique
`<div>
  <div class="slide-subtitle">Technique</div>
  <div class="slide-title">Using the 15C Blade</div>
  <div class="slide-text" style="margin-bottom:20px">The 15C is the standard blade for implant flap incisions. Technique matters more than the blade itself.</div>
  <div class="key-point"><div class="key-num">1</div><div class="key-content"><h4>Vertical Incision</h4><p>Go in and <strong>curve the 15C backwards</strong> towards the back of the patient's mouth. The blade must reach the corner between mucosa and tooth — otherwise the flap will tear on reflection.</p></div></div>
  <div class="key-point"><div class="key-num">2</div><div class="key-content"><h4>Papilla Release</h4><p>When reaching the papilla, make a slight <strong>in-and-out rocking motion</strong> to detach the attachment as you cut. This makes elevation with the Buser elevator much easier.</p></div></div>
  <div class="key-point"><div class="key-num">3</div><div class="key-content"><h4>Mid-Crestal Incision</h4><p>Start from the distal side and move forward. <strong>Twist the blade backward</strong> as you go towards the throat. In reality, you deflect the cheek slightly with the instrument.</p></div></div>
  <div class="key-point"><div class="key-num">4</div><div class="key-content"><h4>Full Thickness</h4><p>Every cut must go <strong>down to the bone</strong>. Don't "chew" the mucosa with back-and-forth motions. Get one point deep, then slide. Think of it like painting — one confident stroke.</p></div></div>
</div>`,

// 24 - Elevation technique
`<div>
  <div class="slide-subtitle">Technique</div>
  <div class="slide-title">Flap Elevation — Two-Hand Technique</div>
  <div class="slide-text" style="margin-bottom:16px">Elevating the mucoperiosteal flap is a <strong>two-hand job</strong>. One hand pushes, the other pulls.</div>
  <div class="diagram-wrap">
    <svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
      <rect x="50" y="20" width="280" height="180" rx="12" fill="#151d2e" stroke="#10b981" stroke-width="1.5"/>

let cur=0;const total=slides.length;
const area=document.getElementById('slideArea'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),dotsC=document.getElementById('dots');
const visited=new Set([0]);
function render(){
  area.innerHTML='';
  const d=document.createElement('div');d.className='slide active';d.innerHTML=`<div class="slide-inner">${slides[cur]}</div>`;
  area.appendChild(d);
  counter.textContent=`${cur+1} / ${total}`;
  progress.style.width=((cur+1)/total*100)+'%';
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').disabled=cur===total-1;
  visited.add(cur);renderDots();
  if(document.getElementById('weightInput'))calcDose();
}
function renderDots(){
  dotsC.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='nav-dot'+(i===cur?' active':visited.has(i)?' visited':'');
    d.onclick=()=>{cur=i;render()};
    dotsC.appendChild(d);
  }
}
function go(dir){cur=Math.max(0,Math.min(total-1,cur+dir));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
function calcDose(){const w=parseInt(document.getElementById('weightInput')?.value)||70;const c=Math.floor(w/10);document.getElementById('doseResult').textContent=c;document.getElementById('mlResult').textContent=c*2}
function checkQuiz(id,el,correct){
  if(el.closest('.quiz-opts').querySelector('.correct,.wrong'))return;
  el.classList.add(correct?'correct':'wrong');
  document.getElementById(id+'-'+(correct?'correct':'wrong')).classList.add('show');
  if(!correct){el.closest('.quiz-opts').querySelectorAll('.quiz-opt').forEach(o=>{if(o!==el){o.onclick=null;o.style.opacity='.4'}})}
}
function toggleReveal(el){el.classList.toggle('open')}
render();
</script>
