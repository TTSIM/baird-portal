<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture 2: Instruments & Surgical Motor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0c1118;--surface:#131b27;--surface2:#1a2438;--card:#16202f;
--accent:#8b5cf6;--accent2:#a78bfa;--accent-warm:#f59e0b;--accent-green:#10b981;--accent-red:#ef4444;--accent-blue:#3b82f6;
--text:#e2e8f0;--text-dim:#94a3b8;--text-bright:#f8fafc;
--border:#1e293b;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
.app{height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.lecture-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase}
.topbar h1{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text-bright)}
.slide-counter{font-size:13px;color:var(--text-dim);font-weight:500}
.progress-track{height:3px;background:var(--border);width:100%}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;border-radius:0 2px 2px 0}
.slide-area{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .45s,transform .45s;transform:translateX(60px)}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide-inner{max-width:960px;width:100%;animation:su .5s ease both}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.nav-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;background:var(--surface);border-top:1px solid var(--border)}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 24px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif}
.nav-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.nav-dots{display:flex;gap:6px}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .25s}
.nav-dot.active{background:var(--accent);transform:scale(1.3)}
.nav-dot.visited{background:var(--text-dim)}
.slide-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,42px);color:var(--text-bright);margin-bottom:8px;line-height:1.2}
.slide-subtitle{font-size:15px;color:var(--accent2);font-weight:500;margin-bottom:28px;letter-spacing:.5px}
.slide-text{font-size:16px;line-height:1.75;color:var(--text);max-width:720px}
.slide-text strong{color:var(--text-bright);font-weight:600}
.title-slide{text-align:center}
.title-slide .slide-title{font-size:clamp(36px,5vw,56px);margin-bottom:16px}
.title-slide .slide-subtitle{font-size:18px;margin-bottom:32px}
.title-meta{font-size:13px;color:var(--text-dim)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:all .3s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px rgba(139,92,246,.1)}
.card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:600;color:var(--text-bright);margin-bottom:6px}
.card p{font-size:13px;color:var(--text-dim);line-height:1.6}
.quiz-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-top:20px}
.quiz-q{font-size:17px;font-weight:600;color:var(--text-bright);margin-bottom:18px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;font-size:14px;transition:all .25s;display:flex;align-items:center;gap:12px}
.quiz-opt:hover{border-color:var(--accent);background:rgba(139,92,246,.06)}
.quiz-opt.correct{border-color:var(--accent-green);background:rgba(16,185,129,.1);color:var(--accent-green)}
.quiz-opt.wrong{border-color:var(--accent-red);background:rgba(239,68,68,.08);color:var(--accent-red)}
.quiz-opt .letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.quiz-opt.correct .letter{background:var(--accent-green);color:#fff}
.quiz-opt.wrong .letter{background:var(--accent-red);color:#fff}
.quiz-feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--accent-green)}
.quiz-feedback.wrong{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--accent-red)}
.diagram-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:16px;overflow-x:auto}
.diagram-wrap svg{width:100%;max-width:800px;margin:0 auto;display:block}
.highlight{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.03));border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:18px 22px;margin-top:16px}
.highlight-title{font-size:13px;font-weight:700;color:var(--accent-warm);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.highlight p{font-size:14px;color:var(--text);line-height:1.7}
.reveal-list{margin-top:16px}
.reveal-item{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:all .3s}
.reveal-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:14px;color:var(--text-bright)}
.reveal-header:hover{color:var(--accent2)}
.reveal-arrow{transition:transform .3s;color:var(--text-dim)}
.reveal-item.open .reveal-arrow{transform:rotate(180deg)}
.reveal-body{max-height:0;overflow:hidden;transition:max-height .4s}
.reveal-item.open .reveal-body{max-height:400px}
.reveal-body-inner{padding:0 18px 16px;font-size:13px;color:var(--text-dim);line-height:1.7}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr}}
.key-point{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.key-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.key-content h4{font-size:15px;color:var(--text-bright);font-weight:600;margin-bottom:3px}
.key-content p{font-size:13px;color:var(--text-dim);line-height:1.6}
.comp-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.comp-table th{background:var(--surface2);color:var(--accent2);padding:12px 16px;text-align:left;font-weight:600;border-bottom:2px solid var(--accent)}
.comp-table td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text)}
.comp-table tr:hover td{background:rgba(139,92,246,.04)}
.warn-box{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.03));border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:18px 22px;margin-top:16px}
.warn-title{font-size:13px;font-weight:700;color:var(--accent-red);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.warn-box p{font-size:14px;color:var(--text);line-height:1.7}
/* Instrument explorer */
.inst-explorer{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-top:16px;min-height:280px}
.inst-tabs{display:flex;flex-direction:column;gap:6px}
.inst-tab{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-dim);transition:all .2s}
.inst-tab:hover{color:var(--text-bright);border-color:var(--accent)}
.inst-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.inst-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;display:none}
.inst-panel.active{display:block}
.inst-panel h3{font-size:17px;font-weight:600;color:var(--text-bright);margin-bottom:4px}
.inst-panel .aka{font-size:12px;color:var(--accent2);margin-bottom:12px}
.inst-panel p{font-size:14px;color:var(--text-dim);line-height:1.7}
@media(max-width:600px){.inst-explorer{grid-template-columns:1fr}.inst-tabs{flex-direction:row;flex-wrap:wrap}}
/* Torque dial */
.dial-wrap{display:flex;justify-content:center;margin-top:20px}
.portal-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600}
.portal-back:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <a class="portal-back" href="../../baird_implant_portal.html">← Back to Portal</a>
      <span class="lecture-badge">Lecture 2</span>
      <h1>Instruments & Surgical Motor</h1>
    </div>
    <span class="slide-counter" id="counter">1 / 30</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="slide-area" id="slideArea"></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Prev</button>
    <div class="nav-dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<script>
const slides=[
// 0 Title
`<div class="title-slide">
  <div class="slide-subtitle">Dental Implant Course — Lecture 2 of 3</div>
  <div class="slide-title">Instruments &<br>Surgical Motor</div>
  <p class="title-meta" style="margin-top:24px;max-width:550px;margin-left:auto;margin-right:auto;line-height:1.7">Covering the Hu-Friedy surgical cassette, elevators (Buser & Mini Me), Prichard curette, Minnesota retractor, probes, surgical motor setup, handpieces, cables, foot pedals, and the manual torque wrench.</p>
  <p class="title-meta" style="margin-top:32px;opacity:.5">Use arrow keys or buttons to navigate • 30 slides</p>
</div>`,

// 1 Hu-Friedy brand
`<div>
  <div class="slide-subtitle">Brand</div>
  <div class="slide-title">Hu-Friedy Surgical Instruments</div>
  <div class="slide-text">Hu-Friedy are one of the most popular and high-quality manufacturers of surgical instrumentation. They originally built their reputation on <strong>surgical instruments only</strong> before expanding into restorative instruments in recent years.</div>
  <div class="highlight" style="margin-top:20px">
    <div class="highlight-title">💡 What Makes Them Special</div>
    <p>Their instruments use <strong>strong stainless steel on the outside while remaining hollow inside</strong>. This makes them lightweight yet extremely durable — critical for long surgical procedures where hand fatigue matters.</p>
  </div>
</div>`,

// 2 Interactive instrument explorer
`<div>
  <div class="slide-subtitle">Overview</div>
  <div class="slide-title">Surgical Instrument Cassette</div>
  <div class="slide-text" style="font-size:14px">Click each instrument to learn about its purpose and usage. These are the core instruments in your implant surgery kit.</div>
  <div class="inst-explorer">
    <div class="inst-tabs">
      <div class="inst-tab active" onclick="showInst(0,this)">Williams Probe</div>
      <div class="inst-tab" onclick="showInst(1,this)">Buser Elevator</div>
      <div class="inst-tab" onclick="showInst(2,this)">Mini Me (Urban)</div>
      <div class="inst-tab" onclick="showInst(3,this)">Prichard Curette</div>
      <div class="inst-tab" onclick="showInst(4,this)">Minnesota Retractor</div>
      <div class="inst-tab" onclick="showInst(5,this)">Saline Pot</div>
      <div class="inst-tab" onclick="showInst(6,this)">Scalpel (15C)</div>
    </div>
    <div>
      <div class="inst-panel active" id="ip0"><h3>Williams Periodontal Probe</h3><div class="aka">Measurement | Assessment</div><p>Used for bone sounding (measuring mucosa-to-bone distance) and verifying implant depth. Marks at 1-2-3-5-7-8-9-10 mm. Choose <strong>plastic over metal</strong> — no reflection under bright lights, markings are clearer, and they don't bend over time.</p></div>
      <div class="inst-panel" id="ip1"><h3>Buser Elevator</h3><div class="aka">Periosteal Elevator | Initial Elevation</div><p>Has a <strong>pointed tip</strong> for initial flap elevation. Polished surface always faces the gum; sharp surface faces bone. Used to tuck under the mucosa and create a tunnel, separating tissue from bone. Essential for the first delicate elevation steps.</p></div>
      <div class="inst-panel" id="ip2"><h3>Mini Me (Urban Tunnelling Instrument)</h3><div class="aka">Blunt Dissection | Periosteal Release</div><p>Designed by <strong>Istvan Urban</strong> (Budapest). Has <strong>blunt, ovate tips</strong> — no sharp corners. Used for periosteal release and tissue dissection with minimal trauma. Causes significantly <strong>less swelling, bruising, and bleeding</strong> compared to using a blade for the same task. Named "Mini Me" by Urban himself.</p></div>
      <div class="inst-panel" id="ip3"><h3>Prichard Curette</h3><div class="aka">Debridement | Cleaning</div><p>Sharp, curved curette that works in <strong>almost all types of defects</strong>. Used to clean granulation tissue, debride extraction sockets, and prepare the surgical site. Essential when there's residual tissue from a healing socket.</p></div>
      <div class="inst-panel" id="ip4"><h3>Minnesota Retractor</h3><div class="aka">Retraction | Visualisation</div><p>Two ends: <strong>cheek contour end</strong> (smooth) for retracting mobile mucosa/cheek, and <strong>sharper end</strong> for retracting flaps against bone. Retract by pushing <strong>down towards the bone</strong> rather than pulling back — better ergonomics and less shoulder strain.</p></div>
      <div class="inst-panel" id="ip5"><h3>Saline Pot / Measuring Cup</h3><div class="aka">Cleaning | Bone Graft Mixing</div><p>Primary use: <strong>cleaning burs during surgery</strong>. Fill with saline, dip used burs to prevent blood from drying on them. Also used for soaking bone graft material and mixing. In a 2-hour procedure, dried blood on burs is extremely difficult to clean afterwards.</p></div>
      <div class="inst-panel" id="ip6"><h3>15C Scalpel Blade</h3><div class="aka">Incision | Flap Design</div><p>The standard blade for implant surgery incisions. Smaller and more curved than a standard 15 blade. Used for intrasulcular incisions, mid-crestal incisions, and vertical releasing incisions. Every cut must go <strong>down to bone</strong> for full-thickness flaps.</p></div>
    </div>
  </div>
</div>`,

// 3 Elevator rules
`<div>
  <div class="slide-subtitle">Principle</div>
  <div class="slide-title">The Universal Elevator Rule</div>
  <div class="diagram-wrap">
    <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="50" y="20" width="280" height="160" rx="14" fill="#16202f" stroke="#10b981" stroke-width="2"/>
      <text x="190" y="55" font-family="DM Serif Display" font-size="18" fill="#10b981" text-anchor="middle">Polished Surface</text>
      <text x="190" y="85" font-family="Outfit" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="600">→ Always faces the GUM</text>
      <text x="190" y="115" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">Smooth, gentle contact</text>
      <text x="190" y="135" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">Protects soft tissue</text>
      <rect x="370" y="20" width="280" height="160" rx="14" fill="#16202f" stroke="#8b5cf6" stroke-width="2"/>
      <text x="510" y="55" font-family="DM Serif Display" font-size="18" fill="#a78bfa" text-anchor="middle">Sharp Surface</text>
      <text x="510" y="85" font-family="Outfit" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="600">→ Always faces the BONE</text>
      <text x="510" y="115" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">More rigid, aggressive</text>
      <text x="510" y="135" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">Engages periosteum</text>
    </svg>
  </div>
  <div class="slide-text" style="margin-top:20px">This rule applies to <strong>every elevator</strong> — the Buser, the Mini Me, and any periosteal elevator. Get this orientation wrong and you'll damage the soft tissue flap.</div>
</div>`,

// 4 Buser vs Mini Me
`<div>
  <div class="slide-subtitle">Comparison</div>
  <div class="slide-title">Buser Elevator vs Mini Me</div>
  <table class="comp-table">
    <thead><tr><th>Feature</th><th>Buser Elevator</th><th>Mini Me (Urban)</th></tr></thead>
    <tbody>
      <tr><td><strong>Tip shape</strong></td><td>Pointed, sharp</td><td>Blunt, ovate on both sides</td></tr>
      <tr><td><strong>Primary use</strong></td><td>Initial flap elevation, papilla release</td><td>Periosteal release, blunt dissection</td></tr>
      <tr><td><strong>Tissue effect</strong></td><td>Clean separation at bone level</td><td>Gentle separation with minimal trauma</td></tr>
      <tr><td><strong>Post-op swelling</strong></td><td>Standard</td><td>Significantly less than blade dissection</td></tr>
      <tr><td><strong>When to use</strong></td><td>Start of flap elevation</td><td>After initial cuts — for periosteal release</td></tr>
      <tr><td><strong>Visual ID</strong></td><td>Pointed metal tip</td><td>Looks like "flat plastic" — blunt corners</td></tr>
    </tbody>
  </table>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">Clinical Evidence</div>
    <p>Urban found that using blunt dissection instead of blade dissection for periosteal release <strong>dramatically reduced post-operative swelling</strong>, especially in larger grafting cases and near the inferior dental nerve.</p>
  </div>
</div>`,

// 5 Mini Me technique
`<div>
  <div class="slide-subtitle">Technique</div>
  <div class="slide-title">Periosteal Release with the Mini Me</div>
  <div class="key-point" style="margin-top:24px"><div class="key-num">1</div><div class="key-content"><h4>Create a Thin Line</h4><p>Use your 15C blade to create a thin incision line through the periosteum, from one side to the other.</p></div></div>
  <div class="key-point"><div class="key-num">2</div><div class="key-content"><h4>Insert the Mini Me</h4><p>Polished flat surface towards the gum (always). Gently insert into the incision line.</p></div></div>
  <div class="key-point"><div class="key-num">3</div><div class="key-content"><h4>Dissect the Pocket</h4><p>Slowly dissect between the mobile mucosa and the periosteum. You're creating a pocket that allows the flap to stretch and close over the augmented site.</p></div></div>
  <div class="key-point"><div class="key-num">4</div><div class="key-content"><h4>Assess Closure</h4><p>The released flap should now passively reach the other side of the surgical site for tension-free closure.</p></div></div>
  <div class="slide-text" style="margin-top:8px;font-size:14px;color:var(--text-dim)"><strong>Timing:</strong> Periosteal release should be done at the <strong>end of surgery</strong> — after grafting — so you can accurately assess how much release is actually needed. Doing it at the start risks under- or over-releasing.</div>
</div>`,

// 6 Why end?
`<div>
  <div class="slide-subtitle">Timing</div>
  <div class="slide-title">Why Do Periosteal Release at the End?</div>
  <div class="two-col">
    <div>
      <div class="card" style="border-color:rgba(16,185,129,.3)">
        <h3 style="color:var(--accent-green)">Reasons to Wait</h3>
        <p style="margin-top:8px;line-height:1.8">• Can't predict how much closure you'll need until after grafting<br>• If a nerve is present (e.g. ID nerve), early release means the nurse retracts over it for hours → nerve trauma<br>• Less total surgical time with tissues exposed<br>• The "shirt analogy" — build the volume first, then size the shirt</p>
      </div>
    </div>
    <div>
      <div class="card" style="border-color:rgba(239,68,68,.3)">
        <h3 style="color:var(--accent-red)">Applies to ALL GBR</h3>
        <p style="margin-top:8px;line-height:1.8">Not just vertical augmentation — all bone grafting increases volume, meaning the flap must close over more material. Whether it's a small buccal defect or a large block graft, periosteal release is almost always needed.</p>
      </div>
    </div>
  </div>
  <div class="highlight" style="margin-top:16px">
    <div class="highlight-title">💡 The Shirt Analogy</div>
    <p>"You can always get fatter, but then you need a bigger shirt to fit." — Build the bone volume first, then release enough periosteum to close the "shirt" over it comfortably.</p>
  </div>
</div>`,

// 7 Minnesota retractor
`<div>
  <div class="slide-subtitle">Retraction</div>
  <div class="slide-title">Minnesota Retractor — Proper Use</div>
  <div class="diagram-wrap">
    <svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg">
      <rect x="50" y="20" width="280" height="200" rx="14" fill="#16202f" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="190" y="55" font-family="DM Serif Display" font-size="16" fill="#f59e0b" text-anchor="middle">Cheek Contour End</text>
      <text x="190" y="85" font-family="Outfit" font-size="13" fill="#e2e8f0" text-anchor="middle">Smooth, rounded curve</text>
      <text x="190" y="115" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">Use for: Mobile mucosa,</text>
      <text x="190" y="135" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">cheek retraction, LA, and</text>
      <text x="190" y="155" font-family="Outfit" font-size="12" fill="#94a3b8" text-anchor="middle">periosteal release area</text>
      <text x="190" y="190" font-family="Outfit" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="600">→ NEVER use sharp end on cheek</text>

// 10 Surgical motor intro
`<div>

    <div class="card"><div class="card-icon" style="background:rgba(59,130,246,.15);color:var(--accent-blue)">💧</div><h3>Built-In Irrigation</h3><p>Saline irrigation via the handpiece prevents overheating of bone during drilling. The irrigation tip is ideally metal and built-in (not detachable).</p></div>

  </div>
</div>`,

// 11 Handpiece care
`<div>
  <div class="slide-subtitle">Maintenance</div>
  <div class="slide-title">Handpiece Care & Common Mistakes</div>
  <div class="warn-box">
    <div class="warn-title">⚠️ Critical Warning</div>
    <p>Do <strong>NOT</strong> let the clinic mix slow-speed handpieces with your implant handpiece. It happens to everyone. Implant handpieces have internal optics, a light, and irrigation — they are precision equipment. Use them <strong>only</strong> for implant work.</p>
  </div>
  <div class="key-point" style="margin-top:24px"><div class="key-num">1</div><div class="key-content"><h4>Oil Regularly</h4><p>Just like any handpiece — follow manufacturer schedule for oiling.</p></div></div>
  <div class="key-point"><div class="key-num">2</div><div class="key-content"><h4>Keep Two in Clinic</h4><p>Nurse forgot to sterilise one? Back-to-back surgeries? One broke? Always have a backup handpiece available.</p></div></div>
  <div class="key-point"><div class="key-num">3</div><div class="key-content"><h4>Replace, Don't Repair</h4><p>After 3–4 years of wear, buying a new cheaper handpiece costs less than repairing an expensive one. Optics, light, and fibers degrade over time.</p></div></div>
</div>`,

// 12 Cable sterilisation
`<div>

  <div class="two-col" style="margin-top:20px">
    <div>
      <div class="card" style="border-color:rgba(239,68,68,.3)">
        <h3 style="color:var(--accent-red)">❌ Don't</h3>
        <p style="margin-top:8px">Sterilise the cable through autoclave unless it has a manufacturer-supplied plastic cap that seals the cable work. Replacement cost: <strong>£600–700</strong>.</p>
      </div>
    </div>
    <div>
      <div class="card" style="border-color:rgba(16,185,129,.3)">
        <h3 style="color:var(--accent-green)">✓ Do</h3>
        <p style="margin-top:8px">Use a <strong>good alcohol wipe</strong> after each use. The handpiece is dressed in a sterile long sleeve during surgery, so the cable itself stays outside the sterile field.</p>
      </div>
    </div>
  </div>
</div>`,

`<div>

// 18 Lever technique
`<div>

  <div class="key-point"><div class="key-num">2</div><div class="key-content"><h4>One Finger Supports the Top</h4><p>The index finger or thumb of the non-dominant hand stabilises the top of the wrench. This prevents the implant from drifting buccally (natural pulling tendency).</p></div></div>
  <div class="key-point"><div class="key-num">3</div><div class="key-content"><h4>Pull From the Lever</h4><p>Apply torque only through the lever. When the lever stops moving easily, that's your insertion torque reading. The dial shows the value.</p></div></div>
</div>`,

`<div>
  <div class="slide-subtitle">Safety</div>
  <div class="slide-title">Connector Fracture Points</div>

    <svg viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="50" y1="80" x2="650" y2="80" stroke="#1e293b" stroke-width="3"/>

      <text x="450" y="120" font-family="Outfit" font-size="11" fill="#ef4444" text-anchor="middle">Implant connection</text>
      <text x="450" y="135" font-family="Outfit" font-size="10" fill="#94a3b8" text-anchor="middle">permanently damaged</text>
      <!-- Scale labels -->
      <text x="50" y="50" font-family="Outfit" font-size="11" fill="#64748b">0 Ncm</text>
      <text x="630" y="50" font-family="Outfit" font-size="11" fill="#64748b">200+ Ncm</text>

      <rect x="50" y="72" width="150" height="16" rx="4" fill="rgba(16,185,129,.2)" stroke="rgba(16,185,129,.4)" stroke-width="1"/>

  <div class="slide-text" style="margin-bottom:16px">Healing abutments come in different <strong>connections</strong> (NC/RC), <strong>widths</strong>, and <strong>heights</strong>.</div>

      </div>
    </div>
  </div>
</div>`,

let cur=0;const total=slides.length;
const area=document.getElementById('slideArea'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),dotsC=document.getElementById('dots');
const visited=new Set([0]);
function render(){area.innerHTML='';const d=document.createElement('div');d.className='slide active';d.innerHTML=`<div class="slide-inner">${slides[cur]}</div>`;area.appendChild(d);counter.textContent=`${cur+1} / ${total}`;progress.style.width=((cur+1)/total*100)+'%';document.getElementById('prevBtn').disabled=cur===0;document.getElementById('nextBtn').disabled=cur===total-1;visited.add(cur);renderDots();if(document.getElementById('hDepth'))calcHA()}
function renderDots(){dotsC.innerHTML='';for(let i=0;i<total;i++){const d=document.createElement('div');d.className='nav-dot'+(i===cur?' active':visited.has(i)?' visited':'');d.onclick=()=>{cur=i;render()};dotsC.appendChild(d)}}
function go(dir){cur=Math.max(0,Math.min(total-1,cur+dir));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
function showInst(n,el){document.querySelectorAll('.inst-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.inst-panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById('ip'+n).classList.add('active')}
function checkQ(id,el,correct){if(el.closest('.quiz-opts').querySelector('.correct,.wrong'))return;el.classList.add(correct?'correct':'wrong');document.getElementById(id+'-'+(correct?'correct':'wrong')).classList.add('show');if(!correct)el.closest('.quiz-opts').querySelectorAll('.quiz-opt').forEach(o=>{if(o!==el){o.onclick=null;o.style.opacity='.4'}})}
function toggleR(el){el.classList.toggle('open')}
function calcHA(){const d=parseFloat(document.getElementById('hDepth')?.value)||2;const m=parseFloat(document.getElementById('hMucosa')?.value)||3;const mg=parseFloat(document.getElementById('hMargin')?.value)||1;document.getElementById('haResult').textContent=(d+m+mg).toFixed(1)}
render();
</script>
