<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 Day 2 Lecture 2</title>
<style>
:root {
  --bg: #0b1120;
  --panel: #152038;
  --panel-2: #1d2b4b;
  --border: #2a3d63;
  --text: #e6edf7;
  --muted: #9fb1cf;
  --accent: #5ee0c1;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { min-height: 100vh; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  background: rgba(11, 17, 32, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { margin: 0; font-size: 16px; color: var(--text); }
.topbar p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.portal-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.portal-back:hover { background: var(--accent); color: #0b1120; }
.frame-wrap { padding: 16px; }
iframe {
  width: 100%;
  min-height: calc(100vh - 108px);
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fff;
}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Module 2 Day 2 Lecture 2</h1>
      <p>Imported local study material</p>
    </div>
    <a class="portal-back" href="../../baird_implant_portal.html">← Back to Portal</a>
  </div>
  <div class="frame-wrap">
    <iframe src="./l2_files/saved_resource.html" title="Module 2 Day 2 Lecture 2"></iframe>
  </div>
</body>
</html>
