<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz 1 — Timing &amp; the ITI Classification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA;--card:#FBFAF6;--ink:#16231F;--ink-soft:#445048;
  --teal:#15564A;--teal-2:#1F7A66;--teal-ghost:#E2EEE9;
  --gold:#C29A45;--gold-soft:#E6D9B4;--rim:#9E3B33;--rim-soft:#F4E0DC;--green:#1f6b53;
  --line:#DFD8C8;--shadow:0 18px 50px -24px rgba(20,40,34,.45);
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,rgba(31,122,102,.06),transparent 40%),radial-gradient(circle at 88% 92%,rgba(194,154,69,.07),transparent 42%)}
.wrap{max-width:760px;margin:0 auto;padding:clamp(18px,4vw,52px) clamp(16px,4vw,32px) 80px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-2);display:flex;align-items:center;gap:.6em}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4.4vw,2.7rem);line-height:1.05;letter-spacing:-.015em;margin:.3em 0 .2em}
.sub{color:var(--ink-soft);font-size:1.02rem;max-width:56ch}
.score-pill{font-family:var(--mono);font-size:.82rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.5em 1em;white-space:nowrap;box-shadow:var(--shadow)}
.bar{height:8px;background:var(--teal-ghost);border-radius:99px;margin:22px 0 4px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-2));border-radius:99px;transition:width .45s cubic-bezier(.5,0,.1,1)}
.bar-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.4vw,32px);box-shadow:var(--shadow);margin-top:22px}
.qtopic{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);background:var(--teal-ghost);border-radius:99px;padding:.3em .8em;margin-bottom:14px}
.qtext{font-family:var(--serif);font-weight:500;font-size:clamp(1.18rem,2.2vw,1.5rem);line-height:1.3;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:.85em 1em;font-size:1rem;color:var(--ink);cursor:pointer;transition:.16s;font-family:var(--sans);line-height:1.4}
.opt:hover:not(.locked){border-color:var(--teal-2);transform:translateX(2px)}
.opt .ltr{font-family:var(--mono);font-weight:600;font-size:.82rem;width:1.7em;height:1.7em;border-radius:7px;background:var(--teal-ghost);color:var(--teal);display:grid;place-items:center;flex:0 0 auto;margin-top:1px;transition:.16s}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green);background:#E4F2EC}
.opt.correct .ltr{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--rim);background:var(--rim-soft)}
.opt.wrong .ltr{background:var(--rim);color:#fff}
.opt.dim{opacity:.55}
.exp{margin-top:16px;border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:13px 16px;font-size:.95rem;color:#5e4a18;
  display:none;animation:fade .3s ease}
.exp.show{display:block}
.exp b{color:#3f3410}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.feedback{font-family:var(--sans);font-weight:600;font-size:.95rem}
.feedback.ok{color:var(--green)}.feedback.no{color:var(--rim)}
.btn{font-family:var(--sans);font-weight:600;font-size:.95rem;border:1px solid var(--teal);background:var(--teal);color:#fff;
  border-radius:11px;padding:.7em 1.4em;cursor:pointer;transition:.18s}
.btn:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal)}
/* results */
.results{text-align:center;display:none}
.results.show{display:block;animation:fade .4s ease}
.ring{width:200px;height:200px;margin:6px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:var(--serif);font-size:3rem;font-weight:600;color:var(--teal);line-height:1}
.ring .pct span{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);letter-spacing:.1em}
.band{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:6px 0 4px}
.review{text-align:left;margin-top:24px}
.review h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-2);margin-bottom:12px}
.rev-item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rim);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:10px;font-size:.92rem}
.rev-item .q{font-weight:600;color:var(--ink)}
.rev-item .a{color:var(--green);margin-top:4px}.rev-item .y{color:var(--rim)}
.brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;text-align:center;margin-top:40px}
@media (max-width:560px){.opt{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">Implant Treatment Planning · Quiz 1</div>
      <h1 id="title">Timing &amp; the ITI Classification</h1>
      <p class="sub" id="sub">30 questions across Lecture 1. Pick an answer to lock it in and see why.</p></div>
    <div class="score-pill" id="scorePill">Score 0 / 0</div>
  </div>
  <div class="bar"><span id="barFill"></span></div>
  <div class="bar-meta"><span id="qcount">Question 1 of 30</span><span id="bestPill"></span></div>

  <div id="quizArea"></div>

  <div class="results" id="results">
    <div class="eyebrow" style="justify-content:center">Results</div>
    <div class="ring"><svg width="200" height="200">
      <circle cx="100" cy="100" r="86" fill="none" stroke="var(--teal-ghost)" stroke-width="16"/>
      <circle id="ringFill" cx="100" cy="100" r="86" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540"/>
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15564A"/><stop offset="1" stop-color="#C29A45"/></linearGradient></defs>
      </svg><div class="pct"><b id="pctNum">0%</b><span id="ratio">0 / 30</span></div></div>
    <div class="band" id="band"></div>
    <p class="sub" id="bandMsg" style="margin:0 auto"></p>
    <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="retry">↺ Retake quiz</button>
      <button class="btn ghost" id="reviewToggle">Review answers</button></div>
    <div class="review" id="review" style="display:none"></div>
  </div>

  <div class="brand">Baird Implant Course · Self-assessment</div>
</div>

<script>
const QUIZ_TITLE="Quiz 1 — Timing & the ITI Classification";
const BEST_KEY="module4_day2_quiz1_implant_timing_best";
const Q=[
 {t:"Timing options",q:"What are the three classic timing options after extraction?",
  o:["Immediate, early, delayed","Primary, secondary, tertiary","Loaded, unloaded, submerged","Open, closed, guided"],a:0,
  e:"The classic framework is immediate, early and delayed placement."},
 {t:"Definitions",q:"“Immediate” placement means the implant is placed:",
  o:["Within 8 weeks","On the same day as extraction","After full bone healing","Once soft tissue has closed"],a:1,
  e:"Immediate = same-day placement into the fresh socket."},
 {t:"Site dependence",q:"Why is “early” not a single fixed number of weeks?",
  o:["Because dentists disagree on definitions","Because tissue healing rate depends on the site and patient","Because the implant brand dictates it","Because radiation rules forbid fixed timing"],a:1,
  e:"Eight weeks at a lower molar behaves differently from eight weeks at an incisor — healing is site- and patient-dependent."},
 {t:"Research",q:"Why do many small immediate-vs-early trials report “no difference”?",
  o:["The techniques are biologically identical","They are underpowered, so a real difference can be hidden","Immediate is always better, masking the result","They use the wrong statistical test deliberately"],a:1,
  e:"Small trials are underpowered: a genuine difference may not reach significance."},
 {t:"Meta-analysis",q:"To strengthen the evidence, a meta-analysis combines:",
  o:["The conclusions of each study","The raw patient numbers across studies","Only the largest single trial","Expert opinion surveys"],a:1,
  e:"You pool the raw patient counts, not the individual conclusions, to gain power."},
 {t:"Meta-analysis",q:"What must studies share before they can be pooled fairly?",
  o:["The same implant brand","A predefined, consistent definition of each group","Identical operators","The same country of origin"],a:1,
  e:"Consistent definitions (same day / within 8 weeks / after 8 weeks) are needed to combine studies."},
 {t:"Cochrane",q:"The Cochrane 8-week reference point is best described as:",
  o:["A biological healing milestone","An arbitrary research convenience for grouping data","The point of peak bone density","A medico-legal requirement"],a:1,
  e:"Eight weeks is a research convenience for sorting studies into comparable buckets — not a clinical truth."},
 {t:"Cochrane",q:"Clinically, why can the 8-week line mislead?",
  o:["A molar socket may still feel empty after 8 weeks while an infected incisor may not heal by 16","Because 8 weeks is too short for any healing","Because bone never changes after 8 weeks","Because soft tissue heals identically everywhere"],a:0,
  e:"The calendar doesn't track biology: sites heal at very different rates."},
 {t:"ITI",q:"The ITI classification (2004) defines timing primarily by:",
  o:["Number of days since extraction","The desired clinical outcome / tissue state found","Implant diameter","Patient age"],a:1,
  e:"The ITI classifies by what you'll find clinically when you open the site, not by days."},
 {t:"Type 1",q:"ITI Type 1 (immediate) is characterised by:",
  o:["Full bone and soft-tissue healing","Zero bone and zero soft-tissue healing","Partial bone healing only","Soft-tissue healing only"],a:1,
  e:"Type 1 = a fresh, empty socket: no bone fill, no soft-tissue cover."},
 {t:"Type 1",q:"With a low-torque Type 1, why is a coronally advanced flap a poor choice?",
  o:["It is too quick","It drags keratinised mucosa to the crest, flattening the sulcus","It cannot be sutured","It requires a guide"],a:1,
  e:"A CAF flattens the vestibule and leaves a tight lip — the better option is a soft-tissue plug."},
 {t:"Type 1",q:"The preferred way to bury a low-torque immediate implant is:",
  o:["Coronally advanced flap","A soft-tissue graft sutured as a plug","Leave it transmucosal","Immediate loading"],a:1,
  e:"A soft-tissue plug is the clean (if advanced) solution for burying a true immediate."},
 {t:"Type 2",q:"ITI Type 2 describes:",
  o:["Empty socket, no cover","Soft-tissue healing over an essentially empty socket","Partial apical bone with granulation","Full healing with shrinkage"],a:1,
  e:"Type 2 = healed keratinised tissue over what is still effectively an empty socket."},
 {t:"Type 2",q:"A key advantage of Type 2 over a true immediate is:",
  o:["Higher insertion torque guaranteed","Healed keratinised tissue makes burying low torque easy","No need to graft ever","Shorter implant always usable"],a:1,
  e:"You inherit healed keratinised mucosa “free of charge”, so a low-torque implant is easy to submerge."},
 {t:"Type 2",q:"If the buccal plate is still present at 8 weeks (Type 2), it is considered:",
  o:["Stable, because bundle-bone loss has already occurred","Doomed to resorb later","Irrelevant to planning","A contraindication to placement"],a:0,
  e:"Bundle-bone resorption happens in the first 6–8 weeks, so a plate surviving to 8 weeks is stable."},
 {t:"Bundle bone",q:"Bundle-bone resorption of the buccal plate mostly occurs in the:",
  o:["First 6–8 weeks","6–12 months","First 24 hours","Second year"],a:0,
  e:"The bundle-bone phase is largely complete by ~6–8 weeks."},
 {t:"Myths",q:"The claim that immediate placement “stops bone loss” is:",
  o:["Correct and evidence-based","A myth from the late 1990s — bundle bone resorbs regardless","True only for molars","True only with grafting"],a:1,
  e:"Immediate placement does not prevent bundle-bone resorption — this was a 1990s misconception."},
 {t:"Type 3",q:"ITI Type 3 is characterised by:",
  o:["Empty socket","Soft-tissue healing with bone fill in the apical half","Full bone healing","No soft-tissue closure"],a:1,
  e:"Type 3 = full soft-tissue closure plus apical bone, with coronal granulation."},
 {t:"Type 3",q:"In Type 3, primary stability is taken from:",
  o:["The buccal plate","The newly-formed apical bone","Soft tissue alone","Bone above the socket only"],a:1,
  e:"New apical bone provides stability, so you no longer depend on bone above the socket."},
 {t:"Type 3",q:"Upper five, mental nerve 2 mm below the socket, granulation coronally with apical bone. Best type?",
  o:["Type 1","Type 2","Type 3","Type 4"],a:2,
  e:"Type 3: the nerve forbids a long implant beyond the socket (Type 1) and Type 2 leaves an empty socket — engage the apical bone."},
 {t:"Type 3",q:"Can you usually promise immediate loading with Type 3?",
  o:["Yes, always","Unlikely — the regenerate isn't yet proper lamellar bone","Only in the mandible","Only with a wide implant"],a:1,
  e:"Reaching 35 Ncm is improbable in immature bone, so immediate loading is unlikely."},
 {t:"Type 4",q:"ITI Type 4 (delayed) offers the best ____ but the worst ____:",
  o:["Volume / quality","Bone quality / ridge volume","Aesthetics / speed","Torque / cleanliness"],a:1,
  e:"The longer you wait, the better the bone quality but the greater the ridge-volume loss."},
 {t:"Type 4",q:"Socket-graft cases are described as a “modified Type 4” because:",
  o:["They heal faster","The graft must mature fully before drilling","They never need a membrane","They are always immediate"],a:1,
  e:"The graft must consolidate; drilling early washes the unconsolidated powder away."},
 {t:"Type 4",q:"Why not drill a socket graft at 8–12 weeks?",
  o:["The patient is still numb","The graft is still powder and washes away on drilling","It is too painful","The CBCT isn't ready"],a:1,
  e:"Immature graft is washed out the moment you drill — let it mature."},
 {t:"Trade-off",q:"Moving from early (Type 1–2) toward late (Type 4) placement generally:",
  o:["Improves both volume and quality","Improves bone quality but reduces ridge volume","Reduces both","Has no effect on either"],a:1,
  e:"Later placement trades ridge volume for better bone quality/fill."},
 {t:"Phenotype",q:"If simply left, a thin phenotype can lose roughly how much ridge volume?",
  o:["About 5%","More than 50%","Exactly 100%","None"],a:1,
  e:"Thin phenotypes can lose >50% of volume; thick phenotypes far less (~20%)."},
 {t:"Protocol",q:"The safe default for an anterior site is usually:",
  o:["Type 1","Type 2","Type 3","Type 4"],a:1,
  e:"Anterior default = Type 2: long implant, stability from bone above the socket, GBR regardless."},
 {t:"Protocol",q:"Which anterior finding breaks the default and rules out Type 1/2?",
  o:["A thick phenotype","A central-incisor socket against the nasal floor (short premaxilla)","A wide ridge","A young patient"],a:1,
  e:"A short premaxilla brings the socket to the nasal floor — choose Type 3 (thick) or socket-graft to Type 4 (thin)."},
 {t:"Protocol",q:"The usual default for posterior sites is:",
  o:["Type 1 only","Type 2 only","Type 3 or Type 4","Never place posteriorly"],a:2,
  e:"Posteriors default to Type 3 / Type 4, with immediate used as a considered exception."},
 {t:"Torque",q:"Which insertion torque is the threshold for immediate loading of a single unit?",
  o:["15 Ncm","20 Ncm","35 Ncm","60 Ncm"],a:2,
  e:"≈35 Ncm is the threshold for single-unit immediate loading; ~25 Ncm guides submerge vs transmucosal."}
];

/* ---------- engine ---------- */
const area=document.getElementById('quizArea');
let idx=0,score=0,answered=false;
const wrong=[];
const barFill=document.getElementById('barFill'),qcount=document.getElementById('qcount'),scorePill=document.getElementById('scorePill');
const LTR=['A','B','C','D','E'];

function best(){try{return +localStorage.getItem(BEST_KEY)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(BEST_KEY,v)}catch(e){}}
document.getElementById('bestPill').textContent=best()?('Best '+best()+'%'):'';

function render(){
  answered=false;
  const item=Q[idx];
  qcount.textContent='Question '+(idx+1)+' of '+Q.length;
  scorePill.textContent='Score '+score+' / '+idx;
  barFill.style.width=(idx/Q.length*100)+'%';
  area.innerHTML=`<div class="card">
    <span class="qtopic">${item.t}</span>
    <div class="qtext">${item.q}</div>
    <div class="opts" id="opts">
      ${item.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${LTR[k]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="exp" id="exp"></div>
    <div class="foot">
      <span class="feedback" id="fb"></span>
      <button class="btn" id="nextBtn" disabled>${idx===Q.length-1?'See results →':'Next question →'}</button>
    </div></div>`;
  const opts=area.querySelectorAll('.opt');
  opts.forEach(btn=>btn.onclick=()=>{
    if(answered)return;answered=true;
    const k=+btn.dataset.k,correct=Q[idx].a;
    opts.forEach((b,kk)=>{b.classList.add('locked');
      if(kk===correct)b.classList.add('correct');
      else if(kk===k)b.classList.add('wrong');
      else b.classList.add('dim');});
    const fb=document.getElementById('fb');
    if(k===correct){score++;fb.textContent='Correct';fb.className='feedback ok';}
    else{fb.textContent='Not quite';fb.className='feedback no';
      wrong.push({q:Q[idx].q,your:Q[idx].o[k],ans:Q[idx].o[correct],e:Q[idx].e});}
    const exp=document.getElementById('exp');exp.innerHTML='<b>Why:</b> '+Q[idx].e;exp.classList.add('show');
    scorePill.textContent='Score '+score+' / '+(idx+1);
    document.getElementById('nextBtn').disabled=false;
  });
  document.getElementById('nextBtn').onclick=()=>{
    if(!answered)return;
    if(idx===Q.length-1){finish();}else{idx++;render();}
  };
}

function finish(){
  area.style.display='none';
  document.getElementById('results').classList.add('show');
  barFill.style.width='100%';qcount.textContent='Complete';
  const pct=Math.round(score/Q.length*100);
  scorePill.textContent='Score '+score+' / '+Q.length;
  document.getElementById('ratio').textContent=score+' / '+Q.length;
  // animate ring + number
  const ring=document.getElementById('ringFill'),C=540;
  setTimeout(()=>{ring.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,0,.1,1)';
    ring.style.strokeDashoffset=C-(C*pct/100);},120);
  let n=0;const step=Math.max(1,Math.round(pct/40));
  const t=setInterval(()=>{n+=step;if(n>=pct){n=pct;clearInterval(t);}document.getElementById('pctNum').textContent=n+'%';},26);
  let band,msg;
  if(pct>=90){band='Excellent';msg='Strong command of timing and the ITI framework — exam-ready.';}
  else if(pct>=75){band='Good';msg='Solid grasp. Revisit the few slides behind your missed questions.';}
  else if(pct>=55){band='Getting there';msg='The framework is forming — review the type definitions and protocols.';}
  else{band='Keep going';msg='Worth another pass through Lecture 1 before retaking.';}
  document.getElementById('band').textContent=band+' · '+pct+'%';
  document.getElementById('bandMsg').textContent=msg;
  if(pct>best())setBest(pct);
  document.getElementById('bestPill').textContent='Best '+best()+'%';
  // review
  const rev=document.getElementById('review');
  if(wrong.length===0){rev.innerHTML='<h3>Review</h3><div class="rev-item" style="border-left-color:var(--green)">Perfect score — nothing to review. Well done.</div>';}
  else{rev.innerHTML='<h3>Review · '+wrong.length+' to revisit</h3>'+wrong.map(w=>
    `<div class="rev-item"><div class="q">${w.q}</div><div class="y">Your answer: ${w.your}</div><div class="a">Correct: ${w.ans}</div><div style="color:var(--ink-soft);margin-top:4px">${w.e}</div></div>`).join('');}
}
document.getElementById('reviewToggle').onclick=()=>{const r=document.getElementById('review');
  r.style.display=r.style.display==='none'?'block':'none';};
document.getElementById('retry').onclick=()=>{idx=0;score=0;wrong.length=0;
  document.getElementById('results').classList.remove('show');area.style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});};

render();
</script>
</body>
</html>
