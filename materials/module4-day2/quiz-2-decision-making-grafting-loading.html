<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz 2 — Decision-Making, Grafting &amp; Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4;--card:#FBFBFD;--ink:#16202E;--ink-soft:#48566A;
  --teal:#1F3A5F;--teal-2:#33639C;--teal-ghost:#E4EAF3;
  --gold:#BF6238;--gold-soft:#F1DBCF;--rim:#9E3B33;--rim-soft:#F3E0DC;--green:#2E8B6F;
  --line:#DBE0E9;--shadow:0 18px 50px -24px rgba(20,30,46,.45);
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,rgba(51,99,156,.07),transparent 40%),radial-gradient(circle at 88% 92%,rgba(191,98,56,.07),transparent 42%)}
.wrap{max-width:760px;margin:0 auto;padding:clamp(18px,4vw,52px) clamp(16px,4vw,32px) 80px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-2);display:flex;align-items:center;gap:.6em}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4.4vw,2.7rem);line-height:1.05;letter-spacing:-.015em;margin:.3em 0 .2em}
.sub{color:var(--ink-soft);font-size:1.02rem;max-width:56ch}
.score-pill{font-family:var(--mono);font-size:.82rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.5em 1em;white-space:nowrap;box-shadow:var(--shadow)}
.bar{height:8px;background:var(--teal-ghost);border-radius:99px;margin:22px 0 4px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-2));border-radius:99px;transition:width .45s cubic-bezier(.5,0,.1,1)}
.bar-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.4vw,32px);box-shadow:var(--shadow);margin-top:22px}
.qtopic{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);background:var(--teal-ghost);border-radius:99px;padding:.3em .8em;margin-bottom:14px}
.qtext{font-family:var(--serif);font-weight:500;font-size:clamp(1.18rem,2.2vw,1.5rem);line-height:1.3;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:.85em 1em;font-size:1rem;color:var(--ink);cursor:pointer;transition:.16s;font-family:var(--sans);line-height:1.4}
.opt:hover:not(.locked){border-color:var(--teal-2);transform:translateX(2px)}
.opt .ltr{font-family:var(--mono);font-weight:600;font-size:.82rem;width:1.7em;height:1.7em;border-radius:7px;background:var(--teal-ghost);color:var(--teal);display:grid;place-items:center;flex:0 0 auto;margin-top:1px;transition:.16s}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green);background:#E2F0EB}
.opt.correct .ltr{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--rim);background:var(--rim-soft)}
.opt.wrong .ltr{background:var(--rim);color:#fff}
.opt.dim{opacity:.55}
.exp{margin-top:16px;border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:13px 16px;font-size:.95rem;color:#7a3c1f;display:none;animation:fade .3s ease}
.exp.show{display:block}.exp b{color:#5a2c14}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.feedback{font-family:var(--sans);font-weight:600;font-size:.95rem}
.feedback.ok{color:var(--green)}.feedback.no{color:var(--rim)}
.btn{font-family:var(--sans);font-weight:600;font-size:.95rem;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:11px;padding:.7em 1.4em;cursor:pointer;transition:.18s}
.btn:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal)}
.results{text-align:center;display:none}
.results.show{display:block;animation:fade .4s ease}
.ring{width:200px;height:200px;margin:6px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:var(--serif);font-size:3rem;font-weight:600;color:var(--teal);line-height:1}
.ring .pct span{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);letter-spacing:.1em}
.band{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:6px 0 4px}
.review{text-align:left;margin-top:24px}
.review h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-2);margin-bottom:12px}
.rev-item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rim);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:10px;font-size:.92rem}
.rev-item .q{font-weight:600;color:var(--ink)}
.rev-item .a{color:var(--green);margin-top:4px}.rev-item .y{color:var(--rim)}
.brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;text-align:center;margin-top:40px}
@media (max-width:560px){.opt{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">Implant Treatment Planning · Quiz 2</div>
      <h1 id="title">Decision-Making, Grafting &amp; Loading</h1>
      <p class="sub">30 questions across Lecture 2. Pick an answer to lock it in and see why.</p></div>
    <div class="score-pill" id="scorePill">Score 0 / 0</div>
  </div>
  <div class="bar"><span id="barFill"></span></div>
  <div class="bar-meta"><span id="qcount">Question 1 of 30</span><span id="bestPill"></span></div>

  <div id="quizArea"></div>

  <div class="results" id="results">
    <div class="eyebrow" style="justify-content:center">Results</div>
    <div class="ring"><svg width="200" height="200">
      <circle cx="100" cy="100" r="86" fill="none" stroke="var(--teal-ghost)" stroke-width="16"/>
      <circle id="ringFill" cx="100" cy="100" r="86" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540"/>
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F3A5F"/><stop offset="1" stop-color="#BF6238"/></linearGradient></defs>
      </svg><div class="pct"><b id="pctNum">0%</b><span id="ratio">0 / 30</span></div></div>
    <div class="band" id="band"></div>
    <p class="sub" id="bandMsg" style="margin:0 auto"></p>
    <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="retry">↺ Retake quiz</button>
      <button class="btn ghost" id="reviewToggle">Review answers</button></div>
    <div class="review" id="review" style="display:none"></div>
  </div>
  <div class="brand">Baird Implant Course · Self-assessment</div>
</div>

<script>
const BEST_KEY="module4_day2_quiz2_implant_decisions_best";
const Q=[
 {t:"Immediate",q:"Which is a genuine advantage of immediate placement?",
  o:["It permanently stops bone loss","A single surgery and anaesthetic","It guarantees the best aesthetics","It lowers the cost to the patient"],a:1,
  e:"One surgical episode and anaesthetic is real; the others are myths or false."},
 {t:"Myths",q:"The claim that atraumatic extraction during an immediate “saves the buccal plate” is:",
  o:["Fully correct","Only briefly true — the plate still remodels via bundle bone","True for molars only","True with a membrane"],a:1,
  e:"The buccal plate remodels through bundle-bone resorption whether preserved or not."},
 {t:"Myths",q:"Preserving soft-tissue architecture around an immediate implant actually comes from:",
  o:["Immediate placement itself","Immediate loading with a temporary crown","Using a wide implant","Submerging the implant"],a:1,
  e:"A temporary crown supports the papilla via the contact point — that is a loading benefit, not a placement one."},
 {t:"Disadvantages",q:"In the evidence, immediate placement is associated with:",
  o:["The most predictable aesthetics","The least predictable aesthetic outcome","No infection risk","Guaranteed high torque"],a:1,
  e:"Immediate placement shows the widest soft-tissue variability and is least predictable aesthetically."},
 {t:"Aesthetics",q:"For a fussy patient with a high smile line, the recommended approach is to:",
  o:["Place immediately for speed","Stage the treatment so tissues can be managed","Avoid implants entirely","Use a longer implant"],a:1,
  e:"Staging lets you diagnose and correct tissue changes at the graft stage."},
 {t:"Drifting",q:"Immediate implants tend to drift toward the palatal bone because:",
  o:["Palatal bone is thinner","Palatal bone is thicker and offers more stability","The nerve pushes the drill","Soft tissue is heavier palatally"],a:1,
  e:"Thicker palatal bone tempts the drill, leaving the shoulder too far buccal."},
 {t:"Drifting",q:"The most reliable way to eliminate drift in an immediate is:",
  o:["A freehand technique with experience","A fully guided digital surgical guide","A wider drill","A longer healing abutment"],a:1,
  e:"A fully guided guide removes drift — the rule is to never do an immediate without one."},
 {t:"Retrograde PI",q:"Which is NOT one of the three causes of retrograde peri-implantitis discussed?",
  o:["Too much torque initially","Infection from adjacent teeth or the socket","Overheating during preparation","Using a resorbable membrane"],a:3,
  e:"The three causes are excess initial torque, infection, and overheating."},
 {t:"Biology",q:"Why is early or delayed placement biologically cleaner than immediate?",
  o:["The body has had time to clear the bacteria","Antibiotics work better later","Bone is softer later","Saline is more effective later"],a:0,
  e:"Removing the failing tooth cuts the bacterial supply, letting the body clear the site over time."},
 {t:"Infected sockets",q:"For a tooth with chronic periapical infection, the evidence suggests immediate placement:",
  o:["Is absolutely contraindicated","Can have similar success if the socket is opened and cleaned thoroughly","Always fails","Needs no special cleaning"],a:1,
  e:"An RCT (attributed to Lindeboom) found similar success in chronic infection provided thorough cleaning."},
 {t:"Infected sockets",q:"Immediate placement into an ACUTELY infected socket should be:",
  o:["Done routinely","Avoided — do not touch it immediately","Done only in the maxilla","Done with a wider implant"],a:1,
  e:"Acute infection is a contraindication to immediate placement."},
 {t:"Cleaning",q:"Degranulation burs are used to clean a socket and are best applied by:",
  o:["Starting small and going larger","Starting large and working down toward the apex","Using a single size throughout","Using them dry at high speed"],a:1,
  e:"Graded burs: start large, move to smaller sizes toward the apex, under saline."},
 {t:"CBCT",q:"For an anterior implant, when is the CBCT best taken?",
  o:["Before extraction","Eight weeks after extraction","Only after placement","Never needed for anteriors"],a:0,
  e:"Anterior CBCT before extraction catches socket-graft cases and still plans the case after a wait."},
 {t:"CBCT",q:"For a posterior implant, the CBCT is usually taken:",
  o:["Before extraction only","About 2 to 3 weeks before placement","One year afterwards","Never"],a:1,
  e:"Posterior socket and sinus levels move, so scan close to surgery to see the real state."},
 {t:"CBCT",q:"Why avoid a second anterior CBCT at 8 weeks in a routine case?",
  o:["It is illegal","It rarely changes the plan and adds radiation","Bone never changes anteriorly","The lab forbids it"],a:1,
  e:"The pre-op scan already plans the case; a second scan rarely justifies the radiation."},
 {t:"Socket graft",q:"Which is a valid indication for socket grafting?",
  o:["Every extraction","An upper six with roots into the sinus, to avoid a later external sinus lift","A young patient with thick bone","A simple uncomplicated molar"],a:1,
  e:"Supporting the sinus floor is one accepted indication; routine grafting is not."},
 {t:"Socket graft",q:"A reason NOT to graft every socket is that routine grafting:",
  o:["Speeds treatment up","Adds about six months and drives patient and operator burnout","Reduces cost","Improves torque"],a:1,
  e:"Graft on indication — blanket grafting adds time, cost and burnout."},
 {t:"Socket graft",q:"For a patient delaying placement by several years, the better graft material is:",
  o:["A fast-resorbing synthetic","A slow-resorbing xenograft or corticocancellous allograft","No graft at all","Autogenous chips only"],a:1,
  e:"Slow-resorbing material maintains volume over the longer wait, especially in thin phenotypes."},
 {t:"Jumping gap",q:"A jumping gap of less than 2 mm means the case is:",
  o:["Ideal for flapless immediate","Not suitable for immediate — the implant sits too buccal","Best grafted inside only","Suitable for immediate loading"],a:1,
  e:"Under 2 mm the implant is too buccal and the bone will not be good enough."},
 {t:"Jumping gap",q:"A jumping gap of 2 to 3 mm calls for:",
  o:["Flapless, graft inside only","Raise a flap and graft inside and outside","No grafting","Submerging without grafting"],a:1,
  e:"2 to 3 mm: raise a flap and graft both inside and outside, then close."},
 {t:"Jumping gap",q:"With a jumping gap of 4 mm or more you can:",
  o:["Stay flapless and graft inside only","Skip grafting entirely","Always immediately load","Only use a short implant"],a:0,
  e:"4 mm or more allows a flapless approach with grafting inside only."},
 {t:"Jumping gap",q:"Why is bone grafting through a tunnel (rather than a flap) discouraged?",
  o:["Tunnels are slower","Bone graft is hard to build and contain via a tunnel","Tunnels cannot be sutured","It needs a guide"],a:1,
  e:"Tunnelling suits soft tissue; building bone through a tunnel is difficult."},
 {t:"Torque",q:"An insertion torque of 18 Ncm means you should:",
  o:["Immediately load a temporary crown","Submerge the implant","Place a long transmucosal healing abutment","Torque the abutment to 35"],a:1,
  e:"At or below 20 Ncm submerge; transmucosal risks chewing micromotion."},
 {t:"Torque",q:"Roughly which torque is the decision point between submerging and transmucosal?",
  o:["10 Ncm","25 Ncm","45 Ncm","60 Ncm"],a:1,
  e:"About 25 Ncm guides the submerge-versus-transmucosal decision."},
 {t:"Torque",q:"Osseointegration is considered to fail when micromotion exceeds about:",
  o:["10 microns","100 microns","1 millimetre","5 millimetres"],a:1,
  e:"Beyond roughly 100 microns of micromotion, integration fails."},
 {t:"Loading",q:"A chairside temporary crown is valuable mainly because it:",
  o:["Replaces the final crown permanently","Acts as a customised healing abutment shaping the emergence profile","Increases insertion torque","Removes the need for a guide"],a:1,
  e:"The temporary crown shapes the emergence profile while the implant integrates."},
 {t:"Overcorrection",q:"With immediate placement you overcorrect the bone graft by aiming for about:",
  o:["1 mm hoping to keep 0.5 mm","4 mm hoping to keep about 2 mm","No extra is needed","10 mm hoping to keep 5 mm"],a:1,
  e:"Expecting minus changes, you build extra: aim for ~4 mm to retain ~2 mm."},
 {t:"Molar",q:"In a molar immediate, the implant should aim to engage the:",
  o:["Buccal plate","Interseptal bone, tilted to exit the central fossa","Lingual plate only","Soft tissue"],a:1,
  e:"Engage interseptal bone and tilt about 5 to 10 degrees so the implant exits in the fossa."},
 {t:"Molar",q:"Deep-thread implants (for example Megagen BlueDiamond) are useful in molar immediates because they:",
  o:["Need no irrigation","Achieve good torque on only about 2 mm of bone engagement","Are always wider","Avoid the need for a guide"],a:1,
  e:"Deep threads gain purchase on minimal bone while keeping a safety zone from the nerve."},
 {t:"Guided surgery",q:"In a guided placement, correct seating is confirmed when:",
  o:["The drill stops spinning","The green line meets the sleeve margin and the black band shows in the window","The torque hits 60 Ncm","The patient feels pressure"],a:1,
  e:"Green line to sleeve margin plus black band in the window confirms position, depth and orientation."}
];

const area=document.getElementById('quizArea');
let idx=0,score=0,answered=false;const wrong=[];
const barFill=document.getElementById('barFill'),qcount=document.getElementById('qcount'),scorePill=document.getElementById('scorePill');
const LTR=['A','B','C','D','E'];
function best(){try{return +localStorage.getItem(BEST_KEY)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(BEST_KEY,v)}catch(e){}}
document.getElementById('bestPill').textContent=best()?('Best '+best()+'%'):'';

function render(){
  answered=false;const item=Q[idx];
  qcount.textContent='Question '+(idx+1)+' of '+Q.length;
  scorePill.textContent='Score '+score+' / '+idx;
  barFill.style.width=(idx/Q.length*100)+'%';
  area.innerHTML=`<div class="card"><span class="qtopic">${item.t}</span>
    <div class="qtext">${item.q}</div>
    <div class="opts" id="opts">${item.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${LTR[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="exp" id="exp"></div>
    <div class="foot"><span class="feedback" id="fb"></span>
      <button class="btn" id="nextBtn" disabled>${idx===Q.length-1?'See results →':'Next question →'}</button></div></div>`;
  const opts=area.querySelectorAll('.opt');
  opts.forEach(btn=>btn.onclick=()=>{
    if(answered)return;answered=true;
    const k=+btn.dataset.k,correct=Q[idx].a;
    opts.forEach((b,kk)=>{b.classList.add('locked');
      if(kk===correct)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');});
    const fb=document.getElementById('fb');
    if(k===correct){score++;fb.textContent='Correct';fb.className='feedback ok';}
    else{fb.textContent='Not quite';fb.className='feedback no';wrong.push({q:Q[idx].q,your:Q[idx].o[k],ans:Q[idx].o[correct],e:Q[idx].e});}
    const exp=document.getElementById('exp');exp.innerHTML='<b>Why:</b> '+Q[idx].e;exp.classList.add('show');
    scorePill.textContent='Score '+score+' / '+(idx+1);
    document.getElementById('nextBtn').disabled=false;});
  document.getElementById('nextBtn').onclick=()=>{if(!answered)return;if(idx===Q.length-1)finish();else{idx++;render();}};
}
function finish(){
  area.style.display='none';document.getElementById('results').classList.add('show');
  barFill.style.width='100%';qcount.textContent='Complete';
  const pct=Math.round(score/Q.length*100);
  scorePill.textContent='Score '+score+' / '+Q.length;
  document.getElementById('ratio').textContent=score+' / '+Q.length;
  const ring=document.getElementById('ringFill'),C=540;
  setTimeout(()=>{ring.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,0,.1,1)';ring.style.strokeDashoffset=C-(C*pct/100);},120);
  let n=0;const step=Math.max(1,Math.round(pct/40));
  const t=setInterval(()=>{n+=step;if(n>=pct){n=pct;clearInterval(t);}document.getElementById('pctNum').textContent=n+'%';},26);
  let band,msg;
  if(pct>=90){band='Excellent';msg='Confident across grafting, loading and guided workflow — exam-ready.';}
  else if(pct>=75){band='Good';msg='Strong. Revisit the slides behind the few you missed.';}
  else if(pct>=55){band='Getting there';msg='Core decisions are landing — drill the jumping-gap and torque rules.';}
  else{band='Keep going';msg='Another pass through Lecture 2 will pay off before retaking.';}
  document.getElementById('band').textContent=band+' · '+pct+'%';
  document.getElementById('bandMsg').textContent=msg;
  if(pct>best())setBest(pct);
  document.getElementById('bestPill').textContent='Best '+best()+'%';
  const rev=document.getElementById('review');
  if(wrong.length===0){rev.innerHTML='<h3>Review</h3><div class="rev-item" style="border-left-color:var(--green)">Perfect score — nothing to review. Well done.</div>';}
  else{rev.innerHTML='<h3>Review · '+wrong.length+' to revisit</h3>'+wrong.map(w=>`<div class="rev-item"><div class="q">${w.q}</div><div class="y">Your answer: ${w.your}</div><div class="a">Correct: ${w.ans}</div><div style="color:var(--ink-soft);margin-top:4px">${w.e}</div></div>`).join('');}
}
document.getElementById('reviewToggle').onclick=()=>{const r=document.getElementById('review');r.style.display=r.style.display==='none'?'block':'none';};
document.getElementById('retry').onclick=()=>{idx=0;score=0;wrong.length=0;document.getElementById('results').classList.remove('show');area.style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});};
render();
</script>
</body>
</html>
