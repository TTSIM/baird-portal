<!doctype html>
<html lang="en">
<body style="margin:0;padding:32px;background:#f2f5f8;color:#172033;font-family:Arial,sans-serif;">
  <main style="max-width:560px;margin:0 auto;padding:30px;border:1px solid #d8dee6;border-radius:12px;background:#ffffff;">
    <p style="margin:0 0 8px;color:#1769e0;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">BAIRD Community</p>
    <h1 style="margin:0 0 18px;font-size:24px;">New community activity</h1>
    <p style="margin:0 0 22px;color:#4c596b;line-height:1.55;">{{message}}</p>
    <a href="{{link}}" style="display:inline-block;padding:11px 16px;border-radius:8px;color:#ffffff;background:#1769e0;font-weight:700;text-decoration:none;">Open BAIRD Community</a>
    <p style="margin:26px 0 0;color:#7a8798;font-size:12px;line-height:1.5;">Clinical details and images are never included in notification emails. Sign in to view activity securely.</p>
  </main>
</body>
</html>
