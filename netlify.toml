[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"
NETLIFY_EMAILS_DIRECTORY = "./email-templates"

[context.deploy-preview.environment]
COMMUNITY_ENABLED = "true"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[functions.emails]
node_bundler = "zisi"

[[plugins]]
package = "@netlify/plugin-emails"
